{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head>
<body>

    <div class="auth-wrapper row g-0">
        <div class="col-md-5 auth-left">
            <h2>Password Reset</h2>
            <p>We will send you a reset link</p>
        </div>

        <div class="col-md-7 auth-right">
            <div class="auth-header">
                <img src="{% static 'images/logo.png' %}" alt="Logo" class="auth-logo">
                <h4 class="brand">Forgot Password</h4>
                <p class="brand-subtitle">Enter your email to reset your password</p>
            </div>

            <form>
                <div class="mb-3 input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" class="form-control" placeholder="Email address" required>
                </div>

                <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>

                <hr>

                <div class="text-center auth-links">
                    <a href="{% url 'signin' %}">Back to sign in</a>
                </div>
            </form>
        </div>
    </div>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>
</html>
