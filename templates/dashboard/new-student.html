{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Student</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>

<body>

    <div class="dashboard-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Menu</span>
            </div>

            <ul class="sidebar-menu list-unstyled">
                <li>
                    <a href="{% url 'index' %}" class="sidebar-link">
                        <i class="bi bi-house-door me-2"></i>
                        <span class="menu-text">Home</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'manage_students' %}" class="sidebar-link active">
                        <i class="bi bi-person-plus me-2"></i>
                        <span class="menu-text">Manage Students</span>
                    </a>
                </li>

                <li>
                    <a href="{% url 'joke' %}" class="sidebar-link">
                        <i class="bi bi-house-door me-2"></i>
                        <span class="menu-text">Random Joke</span>
                    </a>
                </li>

                <li>
                    <a href="{% url 'signout' %}" class="sidebar-link">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        <span class="menu-text">Sign out</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Area -->
        <div class="main-area" id="mainArea">

            <!-- Top Navbar -->
            <nav class="navbar top-navbar navbar-expand bg-white shadow-sm">
                <div class="container-fluid">

                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-secondary me-3" id="sidebarToggle" type="button">
                            <i class="bi bi-list"></i>
                        </button>

                        <a class="navbar-brand d-flex align-items-center m-0" href="#">
                            <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo-img me-2">
                            <span class="logo-text">Admin Panel</span>
                        </a>
                    </div>

                    <div class="dropdown">
                        <a href="#"
                            class="d-flex align-items-center text-decoration-none dropdown-toggle profile-toggle"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-4 me-2"></i>
                            <span class="d-none d-md-inline">Profile</span>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li><a class="dropdown-item" href="{% url 'signin' %}"><i
                                        class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
                        </ul>
                    </div>

                </div>
            </nav>

            <!-- Empty Content -->
            <main class="content-area">
                <div class="content-placeholder">
                    <div class="row">
                        <div class="col-md-8 offset-md-2">
                            <h5 class="mb-3">Add New Student</h5>
                            <form method="post" action="{% url 'newstudent' %}">
                                {% csrf_token %}
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label">Name</label>
                                        <input type="text" class="form-control form-control-sm" name="name" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Email</label>
                                        <input type="email" class="form-control form-control-sm" name="email" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Phone</label>
                                        <input type="text" class="form-control form-control-sm" name="phone" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Cohort</label>
                                        <input type="text" class="form-control form-control-sm" name="cohort" required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Department</label>
                                        <input type="text" class="form-control form-control-sm" name="department"
                                            required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label">Major</label>
                                        <input type="text" class="form-control form-control-sm" name="major" required>
                                    </div>
                                    <div class="col-12">
                                        <label class="form-label">Address</label>
                                        <textarea class="form-control form-control-sm" name="address" rows="2"
                                            required></textarea>
                                    </div>
                                    <div class="col-12">
                                        <button type="submit" class="btn btn-primary btn-sm">
                                            Add Student
                                        </button>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/dashboard.js' %}"></script>
</body>

</html>
