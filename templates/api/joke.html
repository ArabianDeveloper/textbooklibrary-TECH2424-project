{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/dashboard.css' %}" rel="stylesheet">
</head>
<body>

    <div class="dashboard-wrapper">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-title">Menu</span>
            </div>

            <ul class="sidebar-menu list-unstyled">
                <li>
                    <a href="{% url 'index' %}" class="sidebar-link">
                        <i class="bi bi-house-door me-2"></i>
                        <span class="menu-text">Home</span>
                    </a>
                </li>
                <li>
                    <a href="{% url 'manage_students' %}" class="sidebar-link">
                        <i class="bi bi-person-plus me-2"></i>
                        <span class="menu-text">Manage Students</span>
                    </a>
                </li>

                <li>
                    <a href="{% url 'joke' %}" class="sidebar-link active">
                        <i class="bi bi-lightning-charge me-2"></i>
                        <span class="menu-text">Random Joke</span>
                    </a>
                </li>

                <li>
                    <a href="{% url 'signout' %}" class="sidebar-link">
                        <i class="bi bi-box-arrow-right me-2"></i>
                        <span class="menu-text">Sign out</span>
                    </a>
                </li>
            </ul>
        </aside>

        <!-- Main Area -->
        <div class="main-area" id="mainArea">

            <!-- Top Navbar -->
            <nav class="navbar top-navbar navbar-expand bg-white shadow-sm">
                <div class="container-fluid">

                    <div class="d-flex align-items-center">
                        <button class="btn btn-outline-secondary me-3" id="sidebarToggle" type="button">
                            <i class="bi bi-list"></i>
                        </button>

                        <a class="navbar-brand d-flex align-items-center m-0" href="#">
                            <img src="{% static 'images/logo.png' %}" alt="Logo" class="logo-img me-2">
                            <span class="logo-text">Admin Panel</span>
                        </a>
                    </div>

                    <div class="dropdown">
                        <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle profile-toggle"
                           data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle fs-4 me-2"></i>
                            <span class="d-none d-md-inline">Profile</span>
                        </a>

                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item" href="#"><i class="bi bi-person me-2"></i>Profile</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{% url 'signin' %}"><i class="bi bi-box-arrow-right me-2"></i>Sign out</a></li>
                        </ul>
                    </div>

                </div>
            </nav>

            <!-- Empty Content -->
            <main class="content-area">
                <div class="joke-container">
                    <div class="card shadow-sm">
                        <div class="card-body p-4">
                            <h4 class="card-title mb-4">Select Joke Type</h4>
                            <form method="GET" class="joke-form">
                                <div class="mb-3">
                                    <label for="jokeType" class="form-label">Choose a category:</label>
                                    <select id="jokeType" name="type" class="form-select form-select-lg">
                                        <option value="random">Random Joke</option>
                                        {% for type in types %}
                                            <option value="{{ type }}">{{ type|capfirst }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg w-100">
                                    <i class="bi bi-lightning-charge me-2"></i>Get Joke
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                {% if joke %}
                    <div class="joke-result mt-4">
                        <div class="card shadow-sm">
                            <div class="card-body p-4">
                                <h2>{{ joke.setup }}</h2>
                                <h4>{{ joke.punchline }}</h4>
                            </div>
                        </div>
                    </div>
                {% endif %}
            </main>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/dashboard.js' %}"></script>
</body>
</html>
