{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'css/auth.css' %}" rel="stylesheet">
</head>

<body>

    <div class="auth-wrapper row g-0">
        <div class="col-md-5 auth-left">
            <h2>Admin Portal</h2>
            <p>Manage your education platform easily</p>
        </div>

        <div class="col-md-7 auth-right">
            <div class="auth-header">
                <img src="{% static 'images/logo.png' %}" alt="Logo" class="auth-logo">
                <h4 class="brand">Sign In</h4>
                <p class="brand-subtitle">Access your dashboard</p>
            </div>
            
            {% if alert %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ alert }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endif %}
            <form method="post" action="{% url 'signin' %}">
                {% csrf_token %}
                <div class="mb-3 input-group">
                    <span class="input-group-text">
                        <i class="bi bi-envelope"></i>
                    </span>
                    <input type="email" name="email" class="form-control" placeholder="Email address" required>
                </div>
                <div class="mb-3 input-group">
                    <span class="input-group-text">
                        <i class="bi bi-lock"></i>
                    </span>
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                    <span class="input-group-text toggle-password">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
                <div class="d-flex justify-content-between mb-3">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="rememberMe">
                        <label class="form-check-label" for="rememberMe">Remember me</label>
                    </div>
                    <a href="{% url 'forgetpass' %}">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-primary w-100">Sign In</button>
                <hr>
                <div class="text-center auth-links">
                    No account?
                    <a href="{% url 'signup' %}">Sign up</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/auth.js' %}"></script>
</body>

</html>
